name: easy_qr_reader
description: A senior-friendly, instant QR code reader application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Features
  mobile_scanner: ^5.0.0
  permission_handler: ^11.0.0
  url_launcher: ^6.2.0
  vibration: ^1.8.0
  
  # Utilities
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  uuid: ^4.0.0

  # UI/Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
